# Construye la imagen Docker y la publica en GHCR al empujar un tag vX.Y.Z.
# La tienda de Umbrel (Ismaeloul/umbrel-app-store) instala esa imagen.
name: Publicar imagen

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión a partir del tag
        id: version
        run: echo "numero=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ismaeloul/armario-virtual:${{ steps.version.outputs.numero }}
            ghcr.io/ismaeloul/armario-virtual:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
