<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Armario</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Armario" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fbf8fc" />
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee.
      (function () {
        try {
          var t = localStorage.getItem("armario.tema") || "sistema";
          var oscuro = t === "oscuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (oscuro) {
            document.documentElement.classList.add("dark");
            // Barra del navegador a juego desde el primer pintado (luego la mantiene lib/theme.ts).
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#131315");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
